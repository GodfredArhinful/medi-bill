name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The Gemini key (GVAPI) is only read when /api/upload runs, so the build doesn't need it
      - name: Build
        run: npm run build
